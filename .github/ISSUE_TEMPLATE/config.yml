blank_issues_enabled: false
contact_links:
  - name: Questions and design discussions
    url: https://github.com/Dembayev/MCP-HUB/discussions
    about: |
      MCP Hub is pre-alpha. Use Discussions for "how do I..." or "why
      doesn't it..." style questions; reserve Issues for concrete bug
      reports and feature proposals.
