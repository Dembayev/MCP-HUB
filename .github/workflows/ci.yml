name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-flight runs for the same ref when a new commit lands.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (build + test)
    runs-on: macos-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: src-tauri
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo registry + target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: cargo build --lib
        run: cargo build --lib --locked

      - name: cargo test --lib
        run: cargo test --lib --locked

      - name: cargo test --tests
        run: cargo test --tests --locked

      # `cargo fmt --check` and `cargo clippy -- -D warnings` are deliberately
      # NOT enforced here for v0.1-alpha — they generate noise during rapid
      # iteration on pre-alpha code. They'll be added back once the codebase
      # stabilizes around v0.1.

  frontend:
    name: Frontend (tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: npm ci
        run: npm ci

      - name: tsc --noEmit
        run: npx tsc --noEmit

      - name: vite build (production bundle)
        # Catches build-time errors that tsc misses (e.g. import resolution,
        # tailwind class purging, Vite-specific issues).
        run: npm run build
